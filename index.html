</head>
<body>
<!-- PLEASANT STREET: the homes in map and cards views (assets/map.js reads index.json). -->
<div class="app">
  <header class="app-header">
    <div class="app-brand-bar">
      <a id="ps-home" class="app-home" href="./" aria-label="LAZY home — clear search"><img src="favicon.ico" alt="LAZY" width="30" height="30"><img class="app-home-logo" src="assets/lazy-logo.svg" alt="" width="86" height="50"></a>
      <h1 class="app-hide app-brand-name">Pleasant Street</h1>
      <a class="app-header-link app-header-link--add" href="mailto:sandy@lazy.vacations?subject=Add%20my%20house%20to%20Pleasant%20Street">Add your house</a>
      <button id="ps-recents-open" class="app-header-link" type="button" aria-haspopup="dialog">Recent searches</button>
    </div>
    <div class="app-floating-controls">
    <div class="app-bar">
    <div class="app-search-row">
    <label class="app-search"><span class="app-hide">Where to?</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      <input id="ps-q" type="search" placeholder="Where to? City or state" autocomplete="off" aria-describedby="ps-search-guests"><span id="ps-search-guests" class="app-search-guests" hidden></span>
      <ul class="ps-dest-suggest" id="ps-dest-suggest" aria-label="Suggested destinations" hidden></ul></label>
    <span class="app-count" id="ps-count" hidden></span>
    </div>
    <div class="app-header-actions">
    <button class="app-filter-toggle" id="ps-filter-toggle" type="button" aria-label="Filters" title="Filters" aria-expanded="false" aria-controls="ps-filter-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span id="ps-filter-count" aria-hidden="true" hidden></span></button>
    <div class="app-view-switch" role="group" aria-label="View">
      <button type="button" data-view="map" aria-label="Map" title="Map" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z M9 3v16 M15 5v16"/></svg><span class="app-switch-label">Map</span></button>
      <button type="button" data-view="cards" aria-label="Cards" title="Cards" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="app-switch-label">Cards</span></button>
    </div>
    </div>
    </div>
    <nav class="app-destinations" id="ps-destinations" aria-label="Popular destinations" hidden></nav>
    <div class="app-control-row" id="ps-controls"></div>
    </div>
  </header>
  <main class="app-body">
    <section id="ps-landing" class="ps-landing" aria-label="Pleasant Street home" hidden>
      <div class="ps-landing__hero">
      <div id="ps-home-water" class="ps-landing__water" aria-hidden="true"></div>
      <div class="ps-landing__intro">
      <div class="ps-landing__copy">
        <img class="ps-landing__logo" src="assets/lazy-logo.svg" alt="LAZY" width="86" height="50">
        <h2>Pleasant Street</h2>
        <p class="ps-landing__tagline">The largest listing of independent vacation rentals.</p>
        <button id="ps-home-search" class="ps-landing__search" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>Where to?</span><span>Who’s coming?</span></button>
      </div>
      <img class="ps-landing__art" src="assets/pleasant-street-island-20261026.webp" alt="An illustrated island with vacation homes and coral map pins" width="1180" height="590" decoding="async">
      </div>
      <svg class="ps-landing__wave" viewBox="0 0 1440 72" preserveAspectRatio="none" aria-hidden="true"><path fill="white" d="M0,50 C60,58 120,20 210,26 C290,31 330,52 420,50 C520,48 560,24 660,26 C760,28 800,44 880,42 C960,40 1010,16 1110,18 C1200,20 1260,54 1340,52 C1390,51 1420,36 1440,32 L1440,72 L0,72 Z"/></svg>
      </div>
      <section class="ps-landing__featured" aria-labelledby="ps-featured-title"><h2 id="ps-featured-title">Explore stays</h2><p class="ps-landing__caption">Each card takes you to the owner’s website. Book directly.</p><div id="ps-home-featured" class="ps-landing__grid"></div></section>
    </section>
    <section class="app-results" aria-label="Homes">
      <div class="ps-sheet-handle" id="ps-sheet-handle" role="slider" tabindex="0" aria-label="Results panel height" aria-orientation="vertical" aria-valuemin="12" aria-valuemax="100" aria-valuenow="48" aria-valuetext="Results panel 48% open" title="Drag down for a larger map, or up for more results"><span class="ps-sheet-grip"></span><span class="ps-sheet-count" id="ps-sheet-count">Homes</span></div>
      <div class="app-filters" id="ps-filter-panel">
        <div class="app-filter-fields" id="ps-filter-fields">
        <label class="app-sleeps"><span class="app-sleeps__head">Sleeps <b id="ps-sleeps-out">any</b></span>
          <input type="range" id="ps-sleeps" min="1" max="8" step="1" value="1">
          <span class="app-sleeps__ticks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8+</span></span></label>
        <div class="app-pills" id="ps-type" role="group" aria-label="Type: none pressed shows every type">
          <button type="button" data-type="House" aria-pressed="false">House</button><button type="button" data-type="Cabin" aria-pressed="false">Cabin</button><button type="button" data-type="Camp" aria-pressed="false">Camp</button><button type="button" data-type="Apartment" aria-pressed="false">Apartment</button>
        </div>
        <div class="app-pills" id="ps-welcome" role="group" aria-label="Welcome">
          <button type="button" data-need="kids" aria-pressed="false">Kids OK</button><button type="button" data-need="pets" aria-pressed="false">Pets OK</button>
        </div>
        </div>
        <div class="app-card-controls">
          <span>Card size</span>
          <div class="app-size-switch" role="group" aria-label="Card size">
            <button type="button" data-card-size="tiny" aria-pressed="false">Tiny</button>
            <button type="button" data-card-size="large" aria-pressed="true">Large</button>
          </div>
        </div>
      </div>
      <div class="app-list" id="ps-list"></div>
      <section class="ps-selected" id="ps-selected" role="dialog" aria-modal="false" aria-label="Property details" hidden>
        <div class="ps-selected__toolbar">
          <button id="ps-selected-back" type="button" aria-label="Back to search results"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
          <span id="ps-selected-title">Property details</span>
          <div class="ps-selected__tools">
          <button id="ps-selected-share" type="button" aria-label="Share this home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/></svg></button>
          <button id="ps-selected-close" type="button" aria-label="Close property details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
          </div>
        </div>
        <div class="ps-selected__content" id="ps-selected-content"></div>
      </section>
    </section>
    <div class="app-map" id="ps-map" data-src="index.json" role="region" aria-label="Map of homes"></div>
  </main>
</div>
<dialog class="ps-search" id="ps-search" aria-label="Search">
  <form id="ps-search-form" class="ps-search__form">
    <div class="ps-search__body">
      <section class="ps-search__section" aria-labelledby="ps-where-title">
        <div class="ps-search__section-head"><h3 id="ps-where-title">Where</h3><button type="button" id="ps-search-close" aria-label="Close search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <label class="ps-search__where"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="ps-search-where" type="search" aria-label="Search destinations" placeholder="City or state" autocomplete="off"></label>
        <ul class="ps-dest-suggest ps-dest-suggest--inline" id="ps-search-dest-suggest" aria-label="Suggested destinations" hidden></ul>
      </section>
      <section class="ps-search__section ps-search__who" aria-labelledby="ps-who-title">
        <div><h3 id="ps-who-title">Who</h3><p>How many guests?</p></div>
        <div class="ps-guest-stepper"><button id="ps-guests-less" type="button" aria-label="Fewer guests">−</button><output id="ps-guests-value" aria-live="polite">1</output><button id="ps-guests-more" type="button" aria-label="More guests">+</button></div>
      </section>
    </div>
    <div class="ps-search__footer"><button type="button" id="ps-search-clear">Clear all</button><button class="ps-search__submit" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>Search</button></div>
  </form>
</dialog>
<dialog id="ps-recents" class="ps-search ps-recents" aria-label="Recent searches">
  <div class="ps-search__body">
    <div class="ps-search__section-head"><h2>Recent searches</h2><button id="ps-recents-close" type="button" aria-label="Close recent searches"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div id="ps-recents-list"></div>
  </div>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="assets/lazy-water.js?v=1"></script>
<script src="assets/map.js?v=47"></script>
</body>
</html>
