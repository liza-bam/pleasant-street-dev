<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#74e3d1">
<title>Pleasant Street</title>
<meta name="description" content="Vacation homes run by independent hosts, on a map. Open a home to visit its own website and book there.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preload" href="assets/fonts/noto-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/lobster-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<!-- PLEASANT STREET: the homes on a map and in a list (assets/map.js reads street.json). -->
<div class="app">
  <header class="app-bar">
    <h1 class="app-title">Pleasant Street</h1>
    <label class="app-search"><span class="app-hide">Where to?</span>
      <input id="ps-q" type="search" placeholder="Where to? City or state" autocomplete="off"></label>
    <button type="button" id="ps-area" class="app-btn" hidden>Search this area</button>
    <span class="app-count" id="ps-count" aria-live="polite"></span>
  </header>
  <main class="app-body">
    <section class="app-results" aria-label="Homes">
      <div class="app-filters">
        <label class="app-filter"><span class="app-hide">Sleeps</span>
          <select id="ps-sleeps"><option value="">Sleeps: any</option><option value="2">Sleeps 2+</option><option value="4">Sleeps 4+</option><option value="6">Sleeps 6+</option><option value="8">Sleeps 8+</option><option value="10">Sleeps 10+</option></select></label>
        <label class="app-filter"><span class="app-hide">Type</span>
          <select id="ps-type"><option value="">Type: any</option><option>House</option><option>Cabin</option><option>Apartment</option></select></label>
      </div>
      <div class="app-list" id="ps-list"></div>
    </section>
    <div class="app-map" id="ps-map" data-src="street.json" role="region" aria-label="Map of homes"></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/map.js"></script>
</body>
</html>
