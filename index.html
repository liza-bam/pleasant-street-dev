<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#74e3d1">
<title>Pleasant Street</title>
<meta name="description" content="Vacation homes run by independent hosts, on a map. Open a home to visit its own website and book there.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preload" href="assets/fonts/noto-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/lobster-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<!-- ?v=N: raise it when app.css or map.js changes, so browsers fetch the new file. -->
<link rel="stylesheet" href="assets/app.css?v=15">
</head>
<body>
<!-- PLEASANT STREET: the homes on a map and in a list (assets/map.js reads street.json). -->
<div class="app">
  <header class="app-bar">
    <h1 class="app-title">Pleasant Street</h1>
    <label class="app-search"><span class="app-hide">Where to?</span>
      <input id="ps-q" type="search" placeholder="Where to? City or state" autocomplete="off"></label>
    <span class="app-count" id="ps-count" aria-live="polite"></span>
  </header>
  <main class="app-body">
    <section class="app-results" aria-label="Homes">
      <div class="app-filters">
        <label class="app-sleeps"><span class="app-sleeps__head">Sleeps <b id="ps-sleeps-out">any</b></span>
          <input type="range" id="ps-sleeps" min="1" max="8" step="1" value="1">
          <span class="app-sleeps__ticks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8+</span></span></label>
        <div class="app-pills" id="ps-type" role="group" aria-label="Type: none pressed shows every type">
          <button type="button" data-type="House" aria-pressed="false">House</button><button type="button" data-type="Cabin" aria-pressed="false">Cabin</button><button type="button" data-type="Camp" aria-pressed="false">Camp</button><button type="button" data-type="Apartment" aria-pressed="false">Apartment</button>
        </div>
        <div class="app-pills" id="ps-welcome" role="group" aria-label="Welcome">
          <button type="button" data-need="kids" aria-pressed="false">Kids OK</button><button type="button" data-need="pets" aria-pressed="false">Pets OK</button>
        </div>
      </div>
      <div class="app-list" id="ps-list"></div>
    </section>
    <div class="app-map" id="ps-map" data-src="street.json" role="region" aria-label="Map of homes"></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="assets/map.js?v=15"></script>
</body>
</html>
