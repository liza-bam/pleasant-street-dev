# THE INDEX, KEPT FRESH. On every change to the database: rebuild index.md, index.json and street.json.
# Every Monday: check that each home's website still answers, then rebuild. Commits only when something changed.
name: index
on:
  push:
    branches: [main]
    paths: ['data/homes.json', 'tools/build-index.mjs', 'tools/import.py', 'tools/sync-demos.py']
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency: index
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      # Only the data and tools come down; of images/ just the demo photos and LAZY cards this job writes.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/images/*
            /images/demos/
            /images/LAZY-*-card.webp
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with: { python-version: '3.12' }
      - name: Install data-sync dependencies
        if: github.event_name != 'push'
        run: python -m pip install beautifulsoup4 Pillow certifi
      - name: Sync existing demo websites
        if: github.event_name != 'push'
        run: |
          python tools/sync-demos.py
          python tools/import.py data/sources/demos/catalog.json --source lazy
      - name: Check the websites (weekly)
        if: github.event_name != 'push'
        run: node tools/check.mjs
      - name: Build the index
        run: node tools/build-index.mjs
      - name: Commit what changed
        run: |
          git config user.name "pleasant-street-index"
          git config user.email "sandy@lazy.vacations"
          git add data/homes.json data/sources/demos images/demos index.md index.json street.json
          find images -maxdepth 1 -name 'LAZY-*-card.webp' -exec git add {} +
          git diff --cached --quiet || { git commit -m "Index rebuilt: $(date -u +%F)"; git push; }
