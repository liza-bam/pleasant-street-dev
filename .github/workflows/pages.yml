# THE SITE, PUBLISHED. GitHub Pages gets everything except images/ (3 GB+, over Pages' 1 GB limit);
# the photos are served from the four pleasant-street-images shard repos until the repo variable IMAGE_BASE
# names one host (the LAZY bucket: aws s3 sync images/ s3://site-builder-sites-583057901773/pleasant-street/images/,
# IMAGE_BASE=https://pleasant-street.lazy.vacations); then the shards are unused and can be deleted.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Site without the photos
        run: |
          mkdir -p site
          rsync -a --exclude images --exclude .git --exclude site ./ site/
          mkdir -p site/images && cp images/photo-unknown.svg site/images/
          # ONE switch: when IMAGE_BASE (repo variable) is set, every photo comes from that host (the LAZY bucket)
          # and the shards below are ignored. Until then the four pleasant-street-images shards serve them.
          BASE='${{ vars.IMAGE_BASE }}'
          SHARDS='{"MA-10":"https://liza-bam.github.io/pleasant-street-images-5","MA-11":"https://liza-bam.github.io/pleasant-street-images-6","MA-1":"https://liza-bam.github.io/pleasant-street-images-1","MA-6":"https://liza-bam.github.io/pleasant-street-images-2","MA-7":"https://liza-bam.github.io/pleasant-street-images-2","ME-":"https://liza-bam.github.io/pleasant-street-images-3","MA-0":"https://liza-bam.github.io/pleasant-street-images-3","*":"https://liza-bam.github.io/pleasant-street-images-4"}'
          sed -i "s#data-image-base=\"\" data-image-shards=''#data-image-base=\"$BASE\" data-image-shards='$SHARDS'#" site/index.html
          grep -o 'data-image-base="[^"]*"' site/index.html
          du -sh site
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
